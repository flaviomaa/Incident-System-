<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Störungsmeldung</title>
  <style>
    :root {
      --bg: #eef2f6;
      --surface: rgba(255,255,255,.96);
      --surface-soft: #f7f9fb;
      --text: #17212b;
      --muted: #667585;
      --line: #d9e1e8;
      --accent: #16324f;
      --accent-hover: #102941;
      --accent-soft: #e7eef5;
      --danger: #b42318;
      --success: #16704a;
      --warning: #a56a00;
      --warning-soft: #fff9e8;
      --radius: 18px;
      --shadow: 0 22px 55px rgba(24, 48, 72, .10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: radial-gradient(circle at 0 0, #dce8f2 0, transparent 34rem), var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      width: min(100% - 40px, 760px);
      margin: 0 auto;
      padding: 38px 0 64px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 58px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .1em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 18px;
      box-shadow: 0 8px 18px rgba(22,50,79,.2);
    }

    .intro { margin-bottom: 28px; }

    .eyebrow {
      margin: 0 0 10px;
      color: #718397;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--accent);
      font-size: clamp(32px, 6vw, 50px);
      line-height: 1;
      letter-spacing: -.055em;
    }

    .intro p:last-child {
      max-width: 600px;
      margin: 17px 0 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .card {
      padding: clamp(22px, 5vw, 38px);
      border: 1px solid rgba(217,225,232,.95);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 23px 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .field.full { grid-column: 1 / -1; }

    label {
      font-size: 14px;
      font-weight: 750;
    }

    .required {
      color: var(--muted);
      font-weight: 500;
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      font: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    input {
      min-height: 50px;
      padding: 0 15px;
    }

    textarea {
      min-height: 158px;
      padding: 15px;
      resize: vertical;
      line-height: 1.55;
    }

    input::placeholder,
    textarea::placeholder {
      color: #9aa8b5;
    }

    input:hover,
    textarea:hover {
      border-color: #b8c6d2;
    }

    input:focus,
    textarea:focus {
      border-color: #3a688e;
      box-shadow: 0 0 0 4px rgba(58,104,142,.13);
      background: #fcfeff;
    }

    input:invalid:not(:placeholder-shown),
    textarea:invalid:not(:placeholder-shown) {
      border-color: var(--danger);
    }

    .hint,
    .counter {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .counter {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .priority {
      display: flex;
      align-items: flex-start;
      gap: 13px;
      padding: 16px;
      border: 1px solid #e5c77b;
      border-radius: 13px;
      background: var(--warning-soft);
    }

    .priority input {
      width: 19px;
      min-height: 19px;
      margin-top: 2px;
      accent-color: var(--warning);
    }

    .priority label { cursor: pointer; }

    .priority strong {
      display: block;
      margin-bottom: 4px;
      color: #6d4a00;
    }

    .priority span {
      color: #856b36;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    button {
      min-height: 50px;
      padding: 0 24px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 750;
      box-shadow: 0 8px 16px rgba(22,50,79,.2);
      transition: transform .15s, background .15s, opacity .15s, box-shadow .15s;
    }

    button:hover {
      transform: translateY(-2px);
      background: var(--accent-hover);
      box-shadow: 0 12px 22px rgba(22,50,79,.25);
    }

    button:focus-visible {
      outline: 3px solid rgba(58,104,142,.4);
      outline-offset: 3px;
    }

    button:disabled {
      cursor: wait;
      opacity: .6;
      transform: none;
      box-shadow: none;
    }

    .status {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .status.success { color: var(--success); }
    .status.error { color: var(--danger); }

    @media (max-width: 560px) {
      .page {
        width: min(100% - 24px, 720px);
        padding-top: 24px;
      }

      .brand { margin-bottom: 43px; }

      .form-grid {
        grid-template-columns: 1fr;
        gap: 19px;
      }

      .field.full { grid-column: auto; }

      .actions {
        align-items: stretch;
        flex-direction: column;
      }

      button { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="brand">
      <div class="brand-mark">!</div>
      <span>STÖRUNGSMELDUNG</span>
    </div>

    <section class="intro">
      <p class="eyebrow">Meldung erfassen</p>
      <h1>Was ist passiert?</h1>
      <p>Bitte fülle die Felder möglichst genau aus. Die Meldung wird anschließend an die zuständige Stelle weitergeleitet.</p>
    </section>

    <form class="card" id="incidentForm" novalidate>
      <div class="form-grid">
        <div class="field">
          <label for="objectNumber">Objektnummer <span class="required">(Pflichtfeld)</span></label>
          <input id="objectNumber" name="objectNumber" type="text" placeholder="z. B. OBJ-1042" required autocomplete="off" />
          <span class="hint">Die Nummer des überwachten Objekts.</span>
        </div>

        <div class="field">
          <label for="reporterName">Dein Name <span class="required">(Pflichtfeld)</span></label>
          <input id="reporterName" name="reporterName" type="text" placeholder="Vor- und Nachname" required autocomplete="name" />
        </div>

        <div class="field full">
          <label for="title">Überschrift <span class="required">(Pflichtfeld)</span></label>
          <input id="title" name="title" type="text" maxlength="100" placeholder="z. B. Raum 8 – Stromausfall" required />
          <span class="hint">Kurz und eindeutig zusammenfassen.</span>
        </div>

        <div class="field full">
          <label for="description">Ausführliche Beschreibung <span class="required">(Pflichtfeld)</span></label>
          <textarea id="description" name="description" maxlength="2000" placeholder="Was wurde beobachtet? Wann und wo ist es passiert? Welche Auswirkungen gibt es?" required></textarea>
          <span class="counter" id="counter">0 / 2000 Zeichen</span>
        </div>

        <div class="field full">
          <div class="priority">
            <input id="urgent" name="urgent" type="checkbox" />
            <label for="urgent">
              <strong>Dringende Störung</strong>
              <span>Aktivieren, wenn eine unmittelbare Gefahr besteht oder der Betrieb erheblich beeinträchtigt ist.</span>
            </label>
          </div>
        </div>
      </div>

      <div class="actions">
        <div class="status" id="status" role="status" aria-live="polite"></div>
        <button type="submit" id="submitButton">Meldung absenden</button>
      </div>
    </form>
  </main>

  <script>
    const N8N_WEBHOOK_URL = "http://192.168.0.129:5678/webhook/e9f82574-2e2f-43bb-8c7c-dad3524f092b";

    const form = document.querySelector("#incidentForm");
    const description = document.querySelector("#description");
    const counter = document.querySelector("#counter");
    const status = document.querySelector("#status");
    const submitButton = document.querySelector("#submitButton");

    let isSubmitting = false;
    let lastSubmission = null;

    const DUPLICATE_WINDOW_MS = 60000;

    description.addEventListener("input", () => {
      counter.textContent = `${description.value.length} / 2000 Zeichen`;
    });

    function normalizeValue(value) {
      return String(value || "")
        .trim()
        .replace(/\s+/g, " ")
        .toLowerCase();
    }

    function buildPayload() {
      const data = new FormData(form);
      const title = String(data.get("title") || "").trim();
      const descriptionText = String(data.get("description") || "").trim();

      return {
        objectNumber: String(data.get("objectNumber") || "").trim(),
        reporterName: String(data.get("reporterName") || "").trim(),
        title,
        description: descriptionText,
        urgent: data.get("urgent") === "on",
        submittedAt: new Date().toISOString(),
        originalText: `${title}\n\n${descriptionText}`
      };
    }

    function buildDuplicateKey(payload) {
      return [
        normalizeValue(payload.objectNumber),
        normalizeValue(payload.title),
        normalizeValue(payload.description)
      ].join("|");
    }

    function isRecentDuplicate(key) {
      if (!lastSubmission) return false;
      const isSameKey = lastSubmission.key === key;
      const isWithinWindow = Date.now() - lastSubmission.timestamp < DUPLICATE_WINDOW_MS;
      return isSameKey && isWithinWindow;
    }

    function rememberSubmission(key) {
      lastSubmission = {
        key,
        timestamp: Date.now()
      };
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.className = "status";
      status.textContent = "";

      if (!form.reportValidity() || isSubmitting) {
        return;
      }

      const payload = buildPayload();
      const duplicateKey = buildDuplicateKey(payload);

      if (isRecentDuplicate(duplicateKey)) {
        status.className = "status error";
        status.textContent = "Diese Meldung wurde gerade bereits gesendet. Bitte prüfe erst, ob eine neue Meldung wirklich nötig ist.";
        return;
      }

      isSubmitting = true;
      submitButton.disabled = true;
      submitButton.textContent = "Wird gesendet …";

      try {
        const response = await fetch(N8N_WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        let result = null;

        try {
          result = await response.json();
        } catch {
          result = null;
        }

        if (!response.ok || result?.status === "error") {
          throw new Error(result?.message || "Die Meldung konnte nicht verarbeitet werden.");
        }

        rememberSubmission(duplicateKey);

        form.reset();
        counter.textContent = "0 / 2000 Zeichen";
        status.className = result?.status === "duplicate" ? "status error" : "status success";
        status.textContent = result?.message || "Meldung wurde erfolgreich übermittelt.";
      } catch (error) {
        status.className = "status error";
        status.textContent = error.message || "Die Meldung konnte nicht übermittelt werden. Bitte erneut versuchen.";
      } finally {
        isSubmitting = false;
        submitButton.disabled = false;
        submitButton.textContent = "Meldung absenden";
      }
    });
  </script>
</body>
</html>
